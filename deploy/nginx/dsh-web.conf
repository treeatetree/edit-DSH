# Reverse-proxy for official `dsh web` (loopback only). Loaded from /etc/nginx/conf.d/.
# Placeholders __DSH_PUBLISH_PORT__, __DSH_BIND_PORT__, and __DSH_SERVER_NAME__ are
# substituted by install.sh. The named vhost on :80 leaves the existing default_server
# (liushui / finance / hermes) unchanged; only Host matching __DSH_SERVER_NAME__ is routed here.

map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dsh_web {
    server 127.0.0.1:__DSH_BIND_PORT__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DSH_SERVER_NAME__;
    client_max_body_size 32m;

    location / {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

server {
    listen __DSH_PUBLISH_PORT__;
    listen [::]:__DSH_PUBLISH_PORT__;
    server_name _;
    client_max_body_size 32m;

    location / {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
