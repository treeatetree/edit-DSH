# Reverse-proxy for official `dsh web` (loopback only). Loaded from /etc/nginx/conf.d/.
# Placeholders __DSH_PUBLISH_PORT__, __DSH_BIND_PORT__, __DSH_SERVER_NAME__, and
# __DSH_HTTP_PATH__ are substituted by install.sh.
#
# :80 matches __DSH_SERVER_NAME__ (the public IP and optional names). Unmatched Hosts
# still hit the existing default_server (liushui). On the IP Host, `/` and `/api`
# stay liushui/suanzhang; DSH is only under /__DSH_HTTP_PATH__/. /finance and /hermes
# keep those apps reachable. The cloud security group forwards :80 but not
# :__DSH_PUBLISH_PORT__.
#
# The official client calls origin-root `/api`, `/assets`, and `/plugins`. HTML
# under /__DSH_HTTP_PATH__/ rewrites src=/assets, href=/assets (stylesheets and
# modulepreload), plugin boot URLs, and the origin-root manifest/favicon, then
# injects a fetch/WebSocket patch plus a crypto.randomUUID polyfill (browsers
# omit randomUUID on insecure HTTP). CSS under /__DSH_HTTP_PATH__/assets/ rewrites
# url(/assets/ so KaTeX fonts do not resolve to the IP vhost root, whose try_files
# would serve liushui HTML. Substitutions must not rewrite the patch's
# indexOf("/assets/") needle. /__DSH_HTTP_PATH__/api strips the prefix and sets
# Host to the CLI loopback authority so privileged JSON-RPC can pass the
# empty-trust check.
#
# `dsh web` does not gzip. HTML/CSS sub_filter needs uncompressed upstream
# bodies, so those locations clear Accept-Encoding. gzip then runs in nginx
# after substitution. Plugin JS and hashed /assets/ enable proxy_buffering so
# gzip_proxied can compress them; the HTML location stays unbuffered for
# WebSocket and SSE.

map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dsh_web {
    server 127.0.0.1:__DSH_BIND_PORT__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DSH_SERVER_NAME__;
    client_max_body_size 32m;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    root /var/www/liushui;
    index index.html;

    location = /__DSH_HTTP_PATH__ {
        return 301 /__DSH_HTTP_PATH__/;
    }

    location ^~ /__DSH_HTTP_PATH__/api {
        rewrite ^/__DSH_HTTP_PATH__/(.*)$ /$1 break;
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__DSH_BIND_PORT__;
        proxy_set_header Origin "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /__DSH_HTTP_PATH__/assets/ {
        rewrite ^/__DSH_HTTP_PATH__/(.*)$ /$1 break;
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        expires 7d;
        sub_filter_once off;
        sub_filter_types text/css;
        sub_filter 'url(/assets/' 'url(/__DSH_HTTP_PATH__/assets/';
    }

    location ^~ /__DSH_HTTP_PATH__/plugins/ {
        rewrite ^/__DSH_HTTP_PATH__/(.*)$ /$1 break;
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
    }

    location ^~ /__DSH_HTTP_PATH__/ {
        rewrite ^/__DSH_HTTP_PATH__/(.*)$ /$1 break;
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        sub_filter_once off;
        sub_filter '<head>' '<head><script>if(typeof crypto!=="undefined"&&typeof crypto.randomUUID!=="function"){crypto.randomUUID=function(){var a=new Uint8Array(16);crypto.getRandomValues(a);a[6]=a[6]&15|64;a[8]=a[8]&63|128;var h=Array.from(a,function(b){return b.toString(16).padStart(2,"0")}).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}};(function(){var p="/__DSH_HTTP_PATH__";function r(u){try{var x=new URL(String(u),location.href);if(x.host===location.host&&(x.pathname==="/api"||x.pathname.indexOf("/api/")===0||x.pathname.indexOf("/assets/")===0||x.pathname.indexOf("/plugins/")===0))x.pathname=p+x.pathname;return x.href}catch(e){return u}}var f=fetch.bind(window);window.fetch=function(i,n){if(typeof i==="string"||(typeof URL!=="undefined"&&i instanceof URL))return f(r(i),n);if(typeof Request!=="undefined"&&i instanceof Request)return f(new Request(r(i.url),i),n);return f(i,n)};var W=WebSocket;window.WebSocket=function(u,s){return s===undefined?new W(r(u)):new W(r(u),s)};window.WebSocket.prototype=W.prototype;window.WebSocket.CONNECTING=W.CONNECTING;window.WebSocket.OPEN=W.OPEN;window.WebSocket.CLOSING=W.CLOSING;window.WebSocket.CLOSED=W.CLOSED})();</script>';
        sub_filter 'src="/assets/' 'src="/__DSH_HTTP_PATH__/assets/';
        sub_filter 'href="/assets/' 'href="/__DSH_HTTP_PATH__/assets/';
        sub_filter 'href="/manifest.webmanifest' 'href="/__DSH_HTTP_PATH__/manifest.webmanifest';
        sub_filter 'href="/favicon.svg' 'href="/__DSH_HTTP_PATH__/favicon.svg';
        sub_filter '"url":"/plugins/' '"url":"/__DSH_HTTP_PATH__/plugins/';
    }

    location /finance-mcp/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location ^~ /finance {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    location /suanzhang/api/ {
        rewrite ^/suanzhang(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hermes {
        return 301 /hermes/;
    }

    location /hermes/ {
        proxy_pass http://127.0.0.1:9119/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /hermes;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen __DSH_PUBLISH_PORT__;
    listen [::]:__DSH_PUBLISH_PORT__;
    server_name _;
    client_max_body_size 32m;

    location /api {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__DSH_BIND_PORT__;
        proxy_set_header Origin "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        sub_filter_once on;
        sub_filter '<head>' '<head><script>if(typeof crypto!=="undefined"&&typeof crypto.randomUUID!=="function"){crypto.randomUUID=function(){var a=new Uint8Array(16);crypto.getRandomValues(a);a[6]=a[6]&15|64;a[8]=a[8]&63|128;var h=Array.from(a,function(b){return b.toString(16).padStart(2,"0")}).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}}</script>';
    }
}
