# Reverse-proxy for official `dsh web` (loopback only). Loaded from /etc/nginx/conf.d/.
# Placeholders __DSH_PUBLISH_PORT__, __DSH_BIND_PORT__, and __DSH_SERVER_NAME__ are
# substituted by install.sh.
#
# :80 matches __DSH_SERVER_NAME__ (the public IP and optional names). Unmatched Hosts
# still hit the existing default_server (liushui). /finance and /hermes on the IP
# vhost keep those apps reachable. / and /api on the IP Host are DSH — the Web
# client requires those prefixes at the origin root, and the cloud security group
# forwards :80 but not :__DSH_PUBLISH_PORT__.
#
# /api sets Host to the CLI loopback authority and omits Origin. Privileged JSON-RPC
# (`settings.describe`, credentials, …) calls isTrustedApiRequest with an empty
# trustedHosts list, which accepts only a loopback Host; a public Host 403s even when
# `dsh web --trusted-host` lists it. Tunnels must target this nginx, not :__DSH_BIND_PORT__.

map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dsh_web {
    server 127.0.0.1:__DSH_BIND_PORT__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DSH_SERVER_NAME__;
    client_max_body_size 32m;

    location /finance-mcp/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location ^~ /finance {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    location /suanzhang/api/ {
        rewrite ^/suanzhang(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hermes {
        return 301 /hermes/;
    }

    location /hermes/ {
        proxy_pass http://127.0.0.1:9119/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /hermes;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__DSH_BIND_PORT__;
        proxy_set_header Origin "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        # Official 0.1.0-rc.6 calls crypto.randomUUID, which browsers omit on
        # insecure HTTP (a public IP on :80). getRandomValues stays available.
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '<head>' '<head><script>if(typeof crypto!=="undefined"&&typeof crypto.randomUUID!=="function"){crypto.randomUUID=function(){var a=new Uint8Array(16);crypto.getRandomValues(a);a[6]=a[6]&15|64;a[8]=a[8]&63|128;var h=Array.from(a,function(b){return b.toString(16).padStart(2,"0")}).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}}</script>';
    }
}

server {
    listen __DSH_PUBLISH_PORT__;
    listen [::]:__DSH_PUBLISH_PORT__;
    server_name _;
    client_max_body_size 32m;

    location /api {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:__DSH_BIND_PORT__;
        proxy_set_header Origin "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://dsh_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        # Official 0.1.0-rc.6 calls crypto.randomUUID, which browsers omit on
        # insecure HTTP (a public IP on :80). getRandomValues stays available.
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '<head>' '<head><script>if(typeof crypto!=="undefined"&&typeof crypto.randomUUID!=="function"){crypto.randomUUID=function(){var a=new Uint8Array(16);crypto.getRandomValues(a);a[6]=a[6]&15|64;a[8]=a[8]&63|128;var h=Array.from(a,function(b){return b.toString(16).padStart(2,"0")}).join("");return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20)}}</script>';
    }
}
